name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -c "from importlib.metadata import entry_points; eps = list(entry_points(group='gpt_researcher.retrievers', name='helve')); assert len(eps) == 1 and eps[0].load().__name__ == 'HelveSearch'"
